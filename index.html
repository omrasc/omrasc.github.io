<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>We are coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #0f172a;
      --bg2: #0b2545;
      --accent: #7dd3fc;
      --muted: rgba(255,255,255,0.7);
      --card-bg: rgba(255,255,255,0.03);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(125,211,252,0.07), transparent 8%),
                  linear-gradient(135deg,var(--bg1),var(--bg2));
      color:#ffffff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }
    .card{
      width:100%;
      max-width:720px;
      padding:48px;
      border-radius:16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      backdrop-filter: blur(6px);
      text-align:center;
    }
    .logo{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:18px;
    }
    .mark{
      width:50px;
      height:50px;
      border-radius:10px;
      background: linear-gradient(135deg, rgba(125,211,252,0.18), rgba(59,130,246,0.12));
      display:inline-grid;
      place-items:center;
      font-weight:800;
      font-size:18px;
      color:var(--accent);
      border:1px solid rgba(125,211,252,0.06);
      animation: floaty 4s ease-in-out infinite;
    }
    @keyframes floaty {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }
    h1{
      margin:0 0 12px 0;
      font-size: clamp(28px, 4.6vw, 48px);
      line-height:1.02;
      letter-spacing:-0.02em;
      font-weight:800;
      color:#ffffff;
    }
    p.lead{
      margin:0 0 18px 0;
      color:var(--muted);
      font-size:16px;
      line-height:1.6;
      max-width:58ch;
      margin-left:auto;
      margin-right:auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main" aria-labelledby="headline">
      <div class="logo" aria-hidden="true">
        <div class="mark">OMR</div>
        <div>
          <div style="font-weight:800; font-size:14px">OMR Advice & Support Centre</div>
          <div style="font-size:12px; color:var(--muted)">Helping you, simply</div>
        </div>
      </div>

      <h1 id="headline">We are coming soon</h1>

      <p class="lead">
        Welcome. Thanks for dropping by. We are working on something useful and will be ready soon.
      </p>
    </main>
  </div>
</body>
</html>
